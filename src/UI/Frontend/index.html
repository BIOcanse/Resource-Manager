<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>资源管理器</title>
    <link rel="icon" href="data:,">
    <script type="module" src="/src/preferences/preboot.ts"></script>
    <style>
      :root {
        color-scheme: light;
        --preboot-background: rgb(244, 247, 248);
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: var(--preboot-background);
      }

      /* preboot-appearance:begin (generated by scripts/generatePrebootAppearance.mjs) */
      html[data-ui-style="standard"][data-theme="system"] {
        color-scheme: light;
        --preboot-background: rgb(244, 247, 248);
      }
      html[data-ui-style="standard"][data-theme="light"] {
        color-scheme: light;
        --preboot-background: rgb(244, 247, 248);
      }
      html[data-ui-style="standard"][data-theme="dark"] {
        color-scheme: dark;
        --preboot-background: rgb(20, 22, 23);
      }
      html[data-ui-style="standard"][data-theme="lowContrast"] {
        color-scheme: light;
        --preboot-background: rgb(230, 233, 230);
      }
      html[data-ui-style="classic"][data-theme="system"] {
        color-scheme: light;
        --preboot-background: rgb(244, 247, 248);
      }
      html[data-ui-style="classic"][data-theme="light"] {
        color-scheme: light;
        --preboot-background: rgb(244, 247, 248);
      }
      html[data-ui-style="classic"][data-theme="dark"] {
        color-scheme: dark;
        --preboot-background: rgb(20, 22, 23);
      }
      html[data-ui-style="classic"][data-theme="lowContrast"] {
        color-scheme: light;
        --preboot-background: rgb(230, 233, 230);
      }
      html[data-ui-style="soft"][data-theme="system"] {
        color-scheme: light;
        --preboot-background: rgb(238, 242, 247);
      }
      html[data-ui-style="soft"][data-theme="light"] {
        color-scheme: light;
        --preboot-background: rgb(238, 242, 247);
      }
      html[data-ui-style="soft"][data-theme="dark"] {
        color-scheme: dark;
        --preboot-background: rgb(17, 21, 28);
      }
      html[data-ui-style="outline"][data-theme="system"] {
        color-scheme: light;
        --preboot-background: rgb(243, 240, 232);
      }
      html[data-ui-style="outline"][data-theme="paper"] {
        color-scheme: light;
        --preboot-background: rgb(243, 240, 232);
      }
      html[data-ui-style="outline"][data-theme="graphite"] {
        color-scheme: dark;
        --preboot-background: rgb(29, 30, 32);
      }
      html[data-ui-style="outline"][data-theme="blueprint"] {
        color-scheme: dark;
        --preboot-background: rgb(14, 35, 64);
      }
      html[data-ui-style="terminal"][data-theme="phosphor"] {
        color-scheme: dark;
        --preboot-background: rgb(5, 8, 6);
      }
      html[data-ui-style="terminal"][data-theme="amber"] {
        color-scheme: dark;
        --preboot-background: rgb(8, 6, 3);
      }
      html[data-ui-style="terminal"][data-theme="ice"] {
        color-scheme: dark;
        --preboot-background: rgb(4, 7, 11);
      }
      @media (prefers-color-scheme: dark) {
        html[data-ui-style="standard"][data-theme="system"] {
          color-scheme: dark;
          --preboot-background: rgb(20, 22, 23);
        }
        html[data-ui-style="classic"][data-theme="system"] {
          color-scheme: dark;
          --preboot-background: rgb(20, 22, 23);
        }
        html[data-ui-style="soft"][data-theme="system"] {
          color-scheme: dark;
          --preboot-background: rgb(17, 21, 28);
        }
        html[data-ui-style="outline"][data-theme="system"] {
          color-scheme: dark;
          --preboot-background: rgb(29, 30, 32);
        }
      }
      /* preboot-appearance:end */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
